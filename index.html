<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fuze</title>
<link rel="icon" type="image/png" href="favicon.png">

<script src="https://cdn.jsdelivr.net/npm/fabric@6.9.0/dist/index.min.js"></script>

<style>
    :root {
        --paper: #f5f0e6;
        --clay: #a86f4d;
        --pine: #596b4a;
        --dark: #30352f;
        --border: #d6cec0;
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Work Sans", Arial, sans-serif;
        background: var(--paper);
        color: var(--dark);
    }

    body {
        display: flex;
        flex-direction: column;
    }

    /* --------------------------------------------------
       TOOLBAR
    -------------------------------------------------- */

    .toolbar {
        min-height: 50px;
        height: 50px;
        flex: 0 0 50px;
        padding: 5px 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: nowrap;
        white-space: nowrap;
        overflow: visible;
        background: #fff;
        border-bottom: 1px solid var(--border);
        box-shadow: 0 1px 5px rgba(0,0,0,.08);
        z-index: 30;
        scrollbar-width: thin;
    }

    .brand-mark {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -.4px;
        padding: 0 3px;
        flex: 0 0 auto;
    }

    .toolbar-menu {
        position: relative;
        flex: 0 0 auto;
    }

    .toolbar-menu summary {
        list-style: none;
        cursor: pointer;
        user-select: none;
        height: 32px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 9px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        font-size: 13px;
        font-weight: 600;
    }

    .toolbar-menu summary::-webkit-details-marker { display: none; }
    .toolbar-menu[open] summary,
    .toolbar-menu summary:hover { background: var(--paper); border-color: var(--clay); }

    .menu-panel {
        position: absolute;
        top: calc(100% + 7px);
        left: 0;
        min-width: 240px;
        padding: 5px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 9px;
        box-shadow: 0 8px 28px rgba(0,0,0,.16);
        z-index: 100;
    }

    .menu-panel button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        width: 100%;
        height: 34px;
        padding: 0 9px;
        border: 0;
        border-radius: 5px;
        text-align: left;
        font-size: 13px;
        background: transparent;
    }

    .menu-panel button:hover,
    .menu-panel button.active { background: var(--paper); color: var(--dark); }
    .menu-panel button.menu-danger { color: #a33d2d; }
    .menu-separator { height: 1px; margin: 4px 3px; background: var(--border); }
    kbd { font: 11px/1.4 Arial, sans-serif; color: #73776f; background: #f4f2ed; border: 1px solid #e1ddd4; border-radius: 4px; padding: 2px 4px; }

    .toolbar-divider { height: 26px; width: 1px; flex: 0 0 1px; background: var(--border); }

    .control-group {
        display: flex;
        align-items: center;
        gap: 5px;
        flex: 0 0 auto;
        min-width: 0;
    }

    .toolbar-label { font-size: 11px; color: #6c716b; }

    button, select, input[type="number"] {
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: white;
        color: var(--dark);
        font-size: 12px;
    }

    button { padding: 0 8px; cursor: pointer; transition: background .15s ease, border-color .15s ease; }
    button:hover { background: var(--paper); border-color: var(--clay); }
    button:active { transform: translateY(1px); }
    button.active { background: var(--pine); border-color: var(--pine); color: white; }
    button.danger:hover { background: #f8e8e3; border-color: #bd654d; }

    input[type="color"] {
        width: 30px; height: 30px; padding: 2px; border: 1px solid var(--border);
        border-radius: 6px; background: white; cursor: pointer;
    }

    select { padding: 0 5px; }
    #imageResizeSelect { width: 65px; }
    #zoomSelect { width: 65px; }
    input[type="number"] { width: 53px; padding: 0 5px; }
    #eyedropperButton { width: 30px; min-width: 30px; padding: 0; display: flex; align-items: center; justify-content: center; }
    #strokeOpacityInput { width: 74px; height: 20px; margin: 0; }
    #strokeOpacityValue { font-size: 11px; min-width: 29px; }

    @media (max-width: 760px) {
        .toolbar { justify-content: flex-start; gap: 6px; padding-inline: 6px; overflow-x: auto; overflow-y: hidden; }
        .toolbar-label { display: none; }
        .brand-mark { font-size: 15px; }
        #imageResizeSelect { width: 92px; }
        #strokeOpacityInput { width: 60px; }
    }

    /* --------------------------------------------------
       WORKSPACE
    -------------------------------------------------- */

    .workspace {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 30px;
        background:
            radial-gradient(
                circle at 20px 20px,
                rgba(0,0,0,.025) 1px,
                transparent 1px
            );
        background-size: 20px 20px;
    }

    /* Zone de travail et emplacements publicitaires. Le canvas conserve
       sa taille interne de 1200 × 750 px. */
    .workspace-content {
        width: max-content;
        min-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
    }

    .ad-layout {
        display: grid;
        grid-template-columns: 160px 1200px 160px;
        align-items: start;
        justify-content: center;
        gap: 24px;
        width: max-content;
        margin: 0 auto;
    }

    .ad-slot {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #777;
        background: rgba(255,255,255,.72);
        border: 1px dashed #bdb5a8;
        border-radius: 4px;
        font: 12px/1.4 Arial, sans-serif;
        text-align: center;
        overflow: hidden;
    }

    .ad-slot-side {
        width: 160px;
        min-height: 600px;
        margin-top: 0;
    }

    .ad-slot-bottom {
        width: min(728px, calc(100vw - 40px));
        min-height: 90px;
        flex: 0 0 auto;
    }

    .stage {
        position: relative;
        width: 1200px;
        height: 750px;
        margin: 0;
        background: white;
        box-shadow: 0 5px 25px rgba(0,0,0,.18);
        overflow: hidden;
    }

    @media (max-width: 1650px) {
        .ad-layout {
            grid-template-columns: 1200px;
        }
        .ad-slot-side {
            display: none;
        }
    }

    @media (max-width: 760px) {
        .workspace {
            padding: 16px 10px;
        }
        .workspace-content {
            gap: 16px;
        }
        .ad-slot-bottom {
            width: min(100%, 728px);
            min-height: 90px;
        }
    }

    #canvas {
        position: absolute;
        left: 0;
        top: 0;
    }

    .canvas-container {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
    }

    /* --------------------------------------------------
       POIGNÉES DE FLÈCHE
    -------------------------------------------------- */

    #arrow-handles-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
    }

    .arrow-handle {
        position: absolute;

        width: 18px;
        height: 18px;

        margin-left: -9px;
        margin-top: -9px;

        display: none;

        border-radius: 50%;
        border: 3px solid var(--clay);
        background: white;

        box-shadow:
            0 2px 5px rgba(0,0,0,.35);

        pointer-events: auto;
        cursor: crosshair;
        touch-action: none;
    }

    .arrow-handle.visible {
        display: block;
    }

    .arrow-handle:hover {
        transform: scale(1.15);
    }

    .stage.eyedropper-active,
    .stage.eyedropper-active * {
        cursor: url("./pipette.png") 1 30, crosshair !important;
    }

    /* --------------------------------------------------
       STATUS BAR
    -------------------------------------------------- */

    .statusbar {
        height: 30px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;

        background: #fff;
        border-top: 1px solid var(--border);

        font-size: 12px;
        color: #6c716b;

        z-index: 20;
    }

    .empty-message {
        position: absolute;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        pointer-events: none;

        font-size: 18px;
        color: #aaa;
    }
</style>
</head>

<body>

<!-- ==================================================
     TOOLBAR
================================================== -->

<div class="toolbar" role="toolbar" aria-label="Outils Fuze">

    <div class="brand-mark">Fuze</div>

    <details class="toolbar-menu" id="fileMenu">
        <summary>File <span aria-hidden="true">▾</span></summary>
        <div class="menu-panel">
            <button type="button" data-action="open-image">Ouvrir une image <kbd>Ctrl+O</kbd></button>
            <button type="button" data-action="copy-png">Copier l’image annotée <kbd>Ctrl+Alt+C</kbd></button>
            <button type="button" data-action="save-png">Enregistrer en PNG <kbd>Ctrl+S</kbd></button>
            <div class="menu-separator"></div>
            <button type="button" class="menu-danger" data-action="clear-panel">Clear panel <kbd>Ctrl+Alt+⌫</kbd></button>
        </div>
    </details>

    <details class="toolbar-menu" id="editMenu">
        <summary>Edit <span aria-hidden="true">▾</span></summary>
        <div class="menu-panel">
            <button type="button" data-tool="select">Sélection <kbd>S</kbd></button>
            <button type="button" data-tool="text">Texte <kbd>T</kbd></button>
            <button type="button" data-tool="arrow">Flèche <kbd>A</kbd></button>
            <div class="menu-separator"></div>
            <button type="button" data-tool="rectangle">Rectangle <kbd>R</kbd></button>
            <button type="button" data-tool="circle">Cercle <kbd>C</kbd></button>
            <button type="button" data-tool="felt">Feutre <kbd>F</kbd></button>
            <button type="button" data-tool="highlight">Highlight <kbd>H</kbd></button>
            <button type="button" data-tool="blur">Blur <kbd>B</kbd></button>
        </div>
    </details>

    <div class="toolbar-divider"></div>

    <label class="control-group image-size-control" title="Taille appliquée aux images chargées ou collées">
        <span class="toolbar-label">Image size</span>
        <select id="imageResizeSelect" aria-label="Taille de l’image">
            <option value="1" selected>100%</option>
            <option value="0.9">90%</option>
            <option value="0.8">80%</option>
            <option value="0.7">70%</option>
            <option value="0.6">60%</option>
            <option value="0.5">50%</option>
        </select>
    </label>

    <div class="toolbar-divider"></div>

    <div class="control-group color-control">
        <span class="toolbar-label">Color</span>
        <input type="color" id="colorInput" value="#4751e1" aria-label="Couleur du trait" title="Couleur du trait" />
        <button id="eyedropperButton" type="button" title="Prélever une couleur sur le canvas (Échap pour annuler)" aria-label="Pipette">
            <img src="pipette.png" alt="" width="20" height="20" style="object-fit:contain;display:block;pointer-events:none">
        </button>
    </div>

    <div class="toolbar-divider"></div>

    <label class="control-group compact-control" title="Épaisseur du trait">
        <span class="toolbar-label">Thickness</span>
        <input type="number" id="strokeWidthInput" min="1" max="30" value="6" aria-label="Épaisseur" />
    </label>

    <div class="toolbar-divider"></div>

    <label class="control-group transparency-control" title="Transparence du surlignage">
        <span class="toolbar-label">Transparency</span>
        <input type="range" id="strokeOpacityInput" min="10" max="100" value="55" step="5" aria-label="Transparence" />
        <output id="strokeOpacityValue" for="strokeOpacityInput">55%</output>
    </label>

    <div class="toolbar-divider"></div>

    <label class="control-group compact-control" title="Taille du texte">
        <span class="toolbar-label">Text size</span>
        <input type="number" id="fontSizeInput" min="8" max="120" value="32" aria-label="Taille du texte" />
    </label>

    <div class="toolbar-divider"></div>

    <label class="control-group zoom-control" title="Niveau de zoom">
        <span class="toolbar-label">Zoom</span>
        <select id="zoomSelect" aria-label="Zoom">
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
        </select>
    </label>

    <input type="file" id="imageInput" accept="image/*" multiple hidden>

    <!-- Commandes invisibles conservées pour réutiliser les actions existantes. -->
    <div hidden aria-hidden="true">
        <button id="addImageButton" type="button"></button>
        <button id="undoButton" type="button"></button>
        <button id="redoButton" type="button"></button>
        <button id="deleteButton" type="button"></button>
        <button id="zoomInButton" type="button"></button>
        <button id="zoomOutButton" type="button"></button>
        <button id="copyPngButton" type="button"></button>
        <button id="downloadPngButton" type="button"></button>
        <button id="clearButton" type="button"></button>
    </div>
</div>


<!-- ==================================================
     WORKSPACE
================================================== -->

<div
    class="workspace"
    id="workspace"
>

    <div class="workspace-content">
        <div class="ad-layout">
            <aside class="ad-slot ad-slot-side" aria-label="Emplacement publicitaire gauche">
                Publicité
            </aside>

            <div
                class="stage"
                id="stage"
            >

        <canvas
            id="canvas"
            width="1200"
            height="750"
        ></canvas>


        <div
            id="arrow-handles-layer"
        >

            <div
                id="arrowHandleStart"
                class="arrow-handle"
                title="Début de la flèche"
            ></div>

            <div
                id="arrowHandleEnd"
                class="arrow-handle"
                title="Pointe de la flèche"
            ></div>

        </div>


        <div
            id="emptyMessage"
            class="empty-message"
        >
            Ajoutez une image pour commencer
        </div>
            </div>

            <aside class="ad-slot ad-slot-side" aria-label="Emplacement publicitaire droit">
                Publicité
            </aside>
        </div>

        <div class="ad-slot ad-slot-bottom" aria-label="Emplacement publicitaire sous le canvas">
            Publicité
        </div>
    </div>

</div>


<!-- ==================================================
     STATUS
================================================== -->

<div class="statusbar">

    <span id="statusText">
        Prêt
    </span>

    <span id="zoomStatus">
        100%
    </span>

</div>


<script>
"use strict";

/* =====================================================
   INTERNATIONALISATION — français / anglais
   La langue suit la préférence du navigateur.
===================================================== */
const FUZE_LANGUAGE = (navigator.language || navigator.userLanguage || "en").toLowerCase().startsWith("fr") ? "fr" : "en";
document.documentElement.lang = FUZE_LANGUAGE;

const FUZE_I18N = {
    fr: {
        file: "Fichier", edit: "Édition", openImage: "Ouvrir une image",
        copyAnnotated: "Copier l’image annotée", savePng: "Enregistrer en PNG",
        clearPanel: "Effacer le canvas", select: "Sélection", text: "Texte",
        arrow: "Flèche", rectangle: "Rectangle", circle: "Cercle", felt: "Feutre",
        highlight: "Highlight", imageSize: "Taille image",
        highlight: "Highlight", blur: "Brouillage", imageSize: "Taille image",
        color: "Couleur", thickness: "Épaisseur", transparency: "Transparence",
        textSize: "Taille du texte", zoom: "Zoom", toolbar: "Outils Fuze",
        imageSizeTitle: "Taille appliquée aux images chargées ou collées",
        imageSizeAria: "Taille de l’image", strokeColor: "Couleur du trait",
        eyedropperTitle: "Prélever une couleur sur le canvas (Échap pour annuler)",
        eyedropper: "Pipette", thicknessTitle: "Épaisseur du trait", thicknessAria: "Épaisseur",
        transparencyTitle: "Transparence du surlignage", transparencyAria: "Transparence",
        textSizeTitle: "Taille du texte", zoomTitle: "Niveau de zoom",
        arrowStart: "Début de la flèche", arrowEnd: "Pointe de la flèche",
        addImage: "Ajoutez une image pour commencer", ready: "Prêt"
    },
    en: {
        file: "File", edit: "Edit", openImage: "Open image",
        copyAnnotated: "Copy annotated image", savePng: "Save as PNG",
        clearPanel: "Clear canvas", select: "Select", text: "Text",
        arrow: "Arrow", rectangle: "Rectangle", circle: "Circle", felt: "Felt",
        highlight: "Highlight", imageSize: "Image size",
        highlight: "Highlight", blur: "Blur", imageSize: "Image size",
        color: "Color", thickness: "Thickness", transparency: "Transparency",
        textSize: "Text size", zoom: "Zoom", toolbar: "Fuze tools",
        imageSizeTitle: "Size applied to loaded or pasted images",
        imageSizeAria: "Image size", strokeColor: "Stroke color",
        eyedropperTitle: "Pick a color from the canvas (Esc to cancel)",
        eyedropper: "Eyedropper", thicknessTitle: "Stroke thickness", thicknessAria: "Thickness",
        transparencyTitle: "Highlight transparency", transparencyAria: "Transparency",
        textSizeTitle: "Text size", zoomTitle: "Zoom level",
        arrowStart: "Arrow start", arrowEnd: "Arrow tip",
        addImage: "Add an image to get started", ready: "Ready"
    }
};
const fuzeT = key => (FUZE_I18N[FUZE_LANGUAGE] || FUZE_I18N.fr)[key] || key;

function applyFuzeLanguage() {
    const setSummary = (selector, key) => {
        const el = document.querySelector(selector);
        if (el) {
            const firstText = Array.from(el.childNodes).find(n => n.nodeType === Node.TEXT_NODE);
            if (firstText) firstText.textContent = fuzeT(key) + " ";
        }
    };
    setSummary("#fileMenu > summary", "file");
    setSummary("#editMenu > summary", "edit");
    const menuLabels = [
        ['[data-action="open-image"]', 'openImage'],
        ['[data-action="copy-png"]', 'copyAnnotated'],
        ['[data-action="save-png"]', 'savePng'],
        ['[data-action="clear-panel"]', 'clearPanel'],
        ['[data-tool="select"]', 'select'], ['[data-tool="text"]', 'text'],
        ['[data-tool="arrow"]', 'arrow'], ['[data-tool="rectangle"]', 'rectangle'],
        ['[data-tool="circle"]', 'circle'], ['[data-tool="felt"]', 'felt'],
        ['[data-tool="highlight"]', 'highlight'],
        ['[data-tool="blur"]', 'blur']
    ];
    for (const [selector, key] of menuLabels) {
        const el = document.querySelector(selector);
        if (!el) continue;
        const firstText = Array.from(el.childNodes).find(n => n.nodeType === Node.TEXT_NODE);
        if (firstText) firstText.textContent = fuzeT(key) + " ";
    }
    const toolbarLabels = [
        ['.image-size-control .toolbar-label', 'imageSize'],
        ['.color-control .toolbar-label', 'color'],
        ['.compact-control .toolbar-label', 'thickness'],
        ['.transparency-control .toolbar-label', 'transparency'],
        ['label.control-group.compact-control:nth-of-type(1) .toolbar-label', 'thickness'],
        ['.zoom-control .toolbar-label', 'zoom']
    ];
    for (const [selector, key] of toolbarLabels) {
        const el = document.querySelector(selector);
        if (el) el.textContent = fuzeT(key);
    }
    // The two compact controls have the same CSS class; identify text-size control by its input.
    const fontLabel = document.querySelector('label:has(#fontSizeInput) .toolbar-label');
    if (fontLabel) fontLabel.textContent = fuzeT('textSize');
    const imageLabel = document.querySelector('label:has(#imageResizeSelect)');
    if (imageLabel) imageLabel.title = fuzeT('imageSizeTitle');
    const color = document.getElementById('colorInput');
    if (color) { color.setAttribute('aria-label', fuzeT('strokeColor')); color.title = fuzeT('strokeColor'); }
    const eyedropper = document.getElementById('eyedropperButton');
    if (eyedropper) { eyedropper.title = fuzeT('eyedropperTitle'); eyedropper.setAttribute('aria-label', fuzeT('eyedropper')); }
    const thicknessLabel = document.querySelector('label:has(#strokeWidthInput)');
    if (thicknessLabel) thicknessLabel.title = fuzeT('thicknessTitle');
    const thickness = document.getElementById('strokeWidthInput');
    if (thickness) thickness.setAttribute('aria-label', fuzeT('thicknessAria'));
    const opacityLabel = document.querySelector('label:has(#strokeOpacityInput)');
    if (opacityLabel) opacityLabel.title = fuzeT('transparencyTitle');
    const opacity = document.getElementById('strokeOpacityInput');
    if (opacity) opacity.setAttribute('aria-label', fuzeT('transparencyAria'));
    const fontSize = document.getElementById('fontSizeInput');
    if (fontSize) fontSize.title = fuzeT('textSizeTitle');
    const zoomSelect = document.getElementById('zoomSelect');
    if (zoomSelect) zoomSelect.setAttribute('aria-label', fuzeT('zoomTitle'));
    const start = document.getElementById('arrowHandleStart');
    const end = document.getElementById('arrowHandleEnd');
    if (start) start.title = fuzeT('arrowStart');
    if (end) end.title = fuzeT('arrowEnd');
    const empty = document.getElementById('emptyMessage');
    if (empty) empty.textContent = fuzeT('addImage');
    const initialStatus = document.getElementById('statusText');
    if (initialStatus) initialStatus.textContent = fuzeT('ready');
    const toolbar = document.querySelector('.toolbar[role="toolbar"]');
    if (toolbar) toolbar.setAttribute('aria-label', fuzeT('toolbar'));
}



/* =====================================================
   CONSTANTES
===================================================== */

applyFuzeLanguage();

const CANVAS_WIDTH = 1200;
const CANVAS_HEIGHT = 750;

const DEFAULT_COLOR = "#4751e1";
const DEFAULT_STROKE_WIDTH = 6;
const DEFAULT_STROKE_WIDTHS = { rectangle: 6, circle: 6, highlight: 2, felt: 10 };


/* =====================================================
   ÉTAT
===================================================== */

let currentTool = "select";

let zoom = 1;

let drawing = false;
let drawStart = null;
let temporaryObject = null;
let freehandPoints = [];
let blurUpdateInProgress = false;

let history = [];
let historyIndex = -1;
let restoringHistory = false;

let draggingArrowHandle = null;
let editingArrow = null;
let editingText = null;
let editingTextChanged = false;

/* =====================================================
   DOM
===================================================== */

const canvasElement =
    document.getElementById("canvas");

const stage =
    document.getElementById("stage");

const workspace =
    document.getElementById("workspace");

const emptyMessage =
    document.getElementById("emptyMessage");

const statusText =
    document.getElementById("statusText");

const zoomStatus =
    document.getElementById("zoomStatus");

const colorInput =
    document.getElementById("colorInput");

const eyedropperButton =
    document.getElementById("eyedropperButton");

let eyedropperActive = false;

const strokeWidthInput =
    document.getElementById("strokeWidthInput");

const strokeOpacityInput =
    document.getElementById("strokeOpacityInput");
const strokeOpacityValue =
    document.getElementById("strokeOpacityValue");

const fontSizeInput =
    document.getElementById("fontSizeInput");

const imageInput =
    document.getElementById("imageInput");

const imageResizeSelect =
    document.getElementById("imageResizeSelect");

function getImageImportScale() {
    const scale = Number(imageResizeSelect.value);
    return Number.isFinite(scale) && scale > 0 ? scale : 1;
}

const arrowHandleStart =
    document.getElementById("arrowHandleStart");

const arrowHandleEnd =
    document.getElementById("arrowHandleEnd");

/* =====================================================
   FABRIC
===================================================== */

const canvas =
    new fabric.Canvas(
        canvasElement,
        {
            selection: true,
            preserveObjectStacking: true
        }
    );


/* =====================================================
   OUTILS GÉNÉRAUX

        "Prêt": "Ready",

        "Pipette annulée": "Eyedropper cancelled",

    })[text] : text;
    statusText.textContent = translated || text;

    emptyMessage.style.display =

}


function getColor() {

/* =====================================================
   PIPETTE — PRÉLÈVEMENT D'UN PIXEL DU CANVAS
===================================================== */

function activateEyedropper() {
    if (eyedropperActive) {
        cancelEyedropper();
        return;
    }

    eyedropperActive = true;
    eyedropperButton.classList.add("active");
    stage.classList.add("eyedropper-active");

    updateStatus(
        "Pipette active — cliquez sur un pixel du canvas (Échap pour annuler)"
    );
}

function cancelEyedropper() {
    eyedropperActive = false;
    eyedropperButton.classList.remove("active");
    stage.classList.remove("eyedropper-active");
}

function updateEyedropperCursor() {
    if (!canvas || !canvas.upperCanvasEl) {
        return;
    }

    canvas.upperCanvasEl.style.setProperty(
        "cursor",
        eyedropperActive
            ? 'url("./pipette.png") 4 4, cross'
            : ""
    );
}

function sampleCanvasColor(event) {

    // Les coordonnées CSS sont converties en coordonnées réelles
    // du canvas rendu, ce qui tient compte du zoom et du pixel ratio.
    const rect = canvas.lowerCanvasEl.getBoundingClientRect();
    const x = Math.floor((event.clientX - rect.left) * canvas.lowerCanvasEl.width / rect.width);
    const y = Math.floor((event.clientY - rect.top) * canvas.lowerCanvasEl.height / rect.height);

    if (
        x < 0 || y < 0 ||
        x >= canvas.lowerCanvasEl.width ||
        y >= canvas.lowerCanvasEl.height
    ) {
        return null;
    }

    try {
        const context = canvas.lowerCanvasEl.getContext("2d", { willReadFrequently: true });
        const pixel = context.getImageData(x, y, 1, 1).data;
        const alpha = pixel[3] / 255;

        // Le canvas Fabric est transparent hors des objets : on compose
        // ce pixel sur le fond blanc du stage pour récupérer la couleur visible.
        const rgb = [0, 1, 2].map(index =>
            Math.round(pixel[index] * alpha + 255 * (1 - alpha))
        );

        return "#" + rgb.map(value => value.toString(16).padStart(2, "0")).join("").toUpperCase();
    } catch (error) {
        console.error("Impossible de lire le pixel du canvas :", error);
        updateStatus("Lecture du pixel impossible");
        return null;
    }
}


eyedropperButton.addEventListener("click", activateEyedropper);

document.addEventListener("keydown", event => {
    if (event.key === "Escape" && eyedropperActive) {
        cancelEyedropper();
        updateStatus("Pipette annulée");
    }
});


function getStrokeWidth() {

    const value =
        parseFloat(
            strokeWidthInput.value
        );

    return Number.isFinite(value)
        ? Math.max(
            1,
            Math.min(30, value)
        )
        : DEFAULT_STROKE_WIDTH;
}


function getStrokeObjects() {
    return canvas.getActiveObjects().filter(object =>
        isFancyArrow(object) ||
        object.type === "rect" ||
        object.type === "ellipse" ||
        object.type === "path"
    );
}

function getObjectThickness(object) {
    if (isFancyArrow(object)) return Number(object.arrowStrokeWidth ?? object.strokeWidth);
    return Number(object.strokeWidth);
}

function syncThicknessControl() {
    const selected = getStrokeObjects();
    strokeWidthInput.disabled = false;

    if (!selected.length) return;

    const widths = selected.map(getObjectThickness);
    const first = widths[0];
    const same = widths.every(width => Number.isFinite(width) && Math.abs(width - first) < 0.001);

    if (!same) {
        strokeWidthInput.disabled = true;
        strokeWidthInput.title = "Sélection multiple : les épaisseurs sont différentes";
        return;
    }

    strokeWidthInput.value = String(first);
    strokeWidthInput.title = "Épaisseur";
}

function getStrokeOpacity() {
    const value = Number(strokeOpacityInput?.value ?? 55);
    return Math.max(0.1, Math.min(1, (Number.isFinite(value) ? value : 55) / 100));
}

function updateStrokeOpacityLabel() {
    if (strokeOpacityValue && strokeOpacityInput) {
        strokeOpacityValue.value = `${strokeOpacityInput.value}%`;
        strokeOpacityValue.textContent = `${strokeOpacityInput.value}%`;
    }
}

/*
 * PARAMÈTRES DU LISSAGE — ajustables ici :
 * FREEHAND_SMOOTHING_RADIUS : nombre de points voisins de chaque côté.
 *   2 = léger, 4 = fort, 6 à 8 = très fort.
 * FREEHAND_CURRENT_WEIGHT : poids du point courant. Plus il est faible,
 *   plus les tremblements sont supprimés (mais plus les angles sont arrondis).
 */
const FREEHAND_SMOOTHING_RADIUS = 6;
const FREEHAND_CURRENT_WEIGHT = 1;

function smoothFreehandPoints(points) {
    if (points.length <= 2) return points.map(p => ({ x: p.x, y: p.y }));
    const radius = Math.max(1, FREEHAND_SMOOTHING_RADIUS);
    const currentWeight = Math.max(0.1, FREEHAND_CURRENT_WEIGHT);
    return points.map((point, index) => {
        const from = Math.max(0, index - radius);
        const to = Math.min(points.length - 1, index + radius);
        let x = 0, y = 0, count = 0;
        for (let i = from; i <= to; i++) {
            const weight = i === index ? currentWeight : 1;
            x += points[i].x * weight;
            y += points[i].y * weight;
            count += weight;
        }
        return { x: x / count, y: y / count };
    });
}

function makeSmoothPathData(points) {
    const pts = smoothFreehandPoints(points);
    if (!pts.length) return null;
    if (pts.length === 1) {
        const p = pts[0];
        return `M ${p.x} ${p.y} L ${p.x + 0.01} ${p.y + 0.01}`;
    }
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length - 1; i++) {
        const midX = (pts[i].x + pts[i + 1].x) / 2;
        const midY = (pts[i].y + pts[i + 1].y) / 2;
        d += ` Q ${pts[i].x} ${pts[i].y} ${midX} ${midY}`;
    }
    const last = pts[pts.length - 1];
    d += ` Q ${last.x} ${last.y} ${last.x} ${last.y}`;
    return d;
}

function refreshFreehandPreview() {
    if (!freehandPoints.length) return;
    const pathData = makeSmoothPathData(freehandPoints);
    if (!pathData) return;

    const replacement = new fabric.Path(pathData, {
        fill: null,
        stroke: getColor(),
        strokeWidth: getStrokeWidth() * (currentTool === "highlight" ? 2.2 : 1),
        strokeLineCap: "round",
        strokeLineJoin: "round",
        strokeMiterLimit: 2,
        opacity: getStrokeOpacity(),
        selectable: false,
        evented: false,
        objectCaching: false
    });
    replacement.fuzeTool = currentTool;

    if (temporaryObject) {
        const objects = canvas.getObjects();
        const index = objects.indexOf(temporaryObject);
        canvas.remove(temporaryObject);
        temporaryObject = replacement;
        canvas.insertAt(Math.max(0, index), replacement);
    } else {
        temporaryObject = replacement;
        canvas.add(replacement);
    }
    canvas.requestRenderAll();
}

function getFontSize() {

    const value =
        parseFloat(
            fontSizeInput.value
        );

    return Number.isFinite(value)
        ? Math.max(
            8,
            Math.min(120, value)
        )
        : 32;
}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


/* =====================================================
   HISTORIQUE
===================================================== */

const SERIALIZED_PROPERTIES = [

    "arrowType",

    "x1",
    "y1",

    "x2",
    "y2",

    "arrowColor",
    "arrowStrokeWidth",
    "fuzeTool",
    "blurType",
    "blurRadius",

];


function serializeCanvas() {

    return JSON.stringify(
        canvas.toObject(
            SERIALIZED_PROPERTIES
        )
    );
}


function saveHistory() {

    if (restoringHistory) {
        return;
    }

    const state =
        serializeCanvas();

    if (
        historyIndex <
        history.length - 1
    ) {

        history =
            history.slice(
                0,
                historyIndex + 1
            );
    }

    history.push(state);

    historyIndex =
        history.length - 1;

    updateUndoRedoButtons();
}


function restoreHistoryState(
    state
) {

    editingText = null;
    editingTextChanged = false;
    restoringHistory = true;

    hideArrowHandles();

    canvas.loadFromJSON(state)
        .then(() => {

            restoringHistory = false;

            canvas.renderAll();

            updateEmptyMessage();
            updateUndoRedoButtons();

            const active =
                canvas.getActiveObject();

            if (
                active &&
                isFancyArrow(active)
            ) {

                editingArrow =
                    active;

                showArrowHandles(
                    active
                );

            } else {

                editingArrow = null;

                hideArrowHandles();
            }
        })
        .catch(error => {

            restoringHistory = false;

            console.error(
                "Erreur restauration historique :",
                error
            );
        });
}


function undo() {

    if (historyIndex <= 0) {
        return;
    }

    historyIndex--;

    restoreHistoryState(
        history[historyIndex]
    );
}


function redo() {

    if (
        historyIndex >=
        history.length - 1
    ) {
        return;
    }

    historyIndex++;

    restoreHistoryState(
        history[historyIndex]
    );
}


function updateUndoRedoButtons() {

    document.getElementById(
        "undoButton"
    ).disabled =
        historyIndex <= 0;

    document.getElementById(
        "redoButton"
    ).disabled =
        historyIndex >=
        history.length - 1;
}


/* =====================================================
   OUTIL / SÉLECTION
===================================================== */

function setTool(tool) {

    currentTool = tool;

    document
        .querySelectorAll("[data-tool]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.tool === tool
            );
        });

    canvas.isDrawingMode = false;

    if (Object.prototype.hasOwnProperty.call(DEFAULT_STROKE_WIDTHS, tool)) {
        strokeWidthInput.value = String(DEFAULT_STROKE_WIDTHS[tool]);
    }

    if (tool === "select") {

        canvas.selection = true;

        canvas.forEachObject(
            object => {

                object.selectable = true;
                object.evented = true;
            }
        );

        updateStatus(
            "Mode sélection"
        );

    } else {

        canvas.discardActiveObject();

        hideArrowHandles();

        canvas.selection = false;

        canvas.forEachObject(
            object => {

                object.selectable = false;
                object.evented = false;
            }
        );

        updateStatus(
            tool === "felt" ? "Feutre : tracer librement" :
            tool === "highlight" ? "Highlight : tracer un rectangle jaune" :
            "Outil : " + tool
        );
    }

    syncThicknessControl();
    canvas.renderAll();
}

document
    .getElementById(
        "addImageButton"
    )
    .addEventListener(
        "click",
        () => {

            imageInput.click();
        }
    );


imageInput.addEventListener(
    "change",
    async event => {

        const files =
            Array.from(
                event.target.files || []
            );

        for (const file of files) {

            await addImageFromFile(
                file
            );
        }

        imageInput.value = "";
    }
);


async function addImageFromFile(
    file
) {

    if (
        !file.type.startsWith(
            "image/"
        )
    ) {
        return;
    }

    const dataUrl =
        await readFileAsDataURL(
            file
        );

    try {

        const image =
            await fabric.FabricImage.fromURL(
                dataUrl
            );

        image.set({
            originX: "center",
            originY: "center"
        });


        // Applique le pourcentage choisi à l'import.
        // Utiliser scaleX/scaleY : Fabric.js stocke l'échelle dans ces propriétés.
        // « No resize » (1) conserve la taille originale de l'image.
        const importScale = getImageImportScale();

        image.set({
            scaleX: importScale,
            scaleY: importScale,

            left: CANVAS_WIDTH / 2,
            top: CANVAS_HEIGHT / 2
        });


        canvas.add(image);

        canvas.setActiveObject(
            image
        );

        saveHistory();

        updateEmptyMessage();

        updateStatus(
            "Image ajoutée"
        );

    } catch (error) {

        console.error(
            "Erreur chargement image :",
            error
        );

        updateStatus(
            "Impossible de charger l'image"
        );
    }
}


function readFileAsDataURL(
    file
) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}

workspace.addEventListener(

        const files =

                event.dataTransfer.files || []

        for (
            const file of files
        ) {

            if (

                file.type.startsWith(

                )
            ) {
