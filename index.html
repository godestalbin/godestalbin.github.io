                    file
                );
            }
        }
    }
);

/* =====================================================
   BLUR
===================================================== */

/*
 * Le blur est enregistré comme une image Fabric indépendante.
 *
 * L'image d'origine reste donc intacte dessous :
 * - supprimer le blur révèle immédiatement l'original ;
 * - déplacer/redimensionner le blur reste possible avec les
 *   contrôles Fabric ;
 * - le résultat est inclus dans l'historique et dans le PNG.
 *
 * Lorsqu'un blur existant est modifié, son contenu est régénéré
 * à partir de ce qui se trouve réellement dessous.
 */

const DEFAULT_BLUR_RADIUS = 4;

function isBlur(object) {

    return !!(
        object &&
        object.blurType === "blur"
    );
}


function getBlurRadius() {

    return DEFAULT_BLUR_RADIUS;
}


/*
 * Capture la zone demandée sans le blur lui-même.
 * Une marge supplémentaire est capturée afin que le flou
 * puisse déborder légèrement sans être coupé sur les bords.
 */
function createBlurredCanvas(
    left,
    top,
    width,
    height,
    radius = DEFAULT_BLUR_RADIUS
) {

    /*
     * IMPORTANT : ne pas utiliser canvas.toCanvasElement() ici.
     * Avec Fabric 6 + setZoom() cette API peut, selon l'état du
     * canvas, retourner un canvas temporaire de 0 x 0.
     *
     * On utilise directement le canvas réellement rendu par Fabric.
     * Les coordonnées de nos objets restent en coordonnées de scène
     * (1200 x 750), puis sont converties en pixels du canvas rendu.
     */

    const safeWidth = Math.max(
        1,
        Math.round(Number(width) || 0)
    );

    const safeHeight = Math.max(
        1,
        Math.round(Number(height) || 0)
    );

    const safeLeft = Number.isFinite(left)
        ? left
        : 0;

    const safeTop = Number.isFinite(top)
        ? top
        : 0;

    const safeZoom = Number.isFinite(zoom) && zoom > 0
        ? zoom
        : 1;

    const padding = Math.max(
        2,
        Math.ceil(Number(radius) || 0) * 2
    );

    const captureLeft = Math.max(
        0,
        Math.floor(safeLeft - padding)
    );

    const captureTop = Math.max(
        0,
        Math.floor(safeTop - padding)
    );

    const captureRight = Math.min(
        CANVAS_WIDTH,
        Math.ceil(safeLeft + safeWidth + padding)
    );

    const captureBottom = Math.min(
        CANVAS_HEIGHT,
        Math.ceil(safeTop + safeHeight + padding)
    );

    const captureWidth = Math.max(
        1,
        captureRight - captureLeft
    );

    const captureHeight = Math.max(
        1,
        captureBottom - captureTop
    );

    /* Canvas réellement rendu par Fabric. */
    const source = canvas.lowerCanvasEl;

    if (
        !source ||
        source.width <= 0 ||
        source.height <= 0
    ) {
        console.error(
            "Canvas Fabric invalide pour le blur :",
            source?.width,
            source?.height
        );
        return null;
    }

    /*
     * lowerCanvasEl peut avoir une résolution supérieure à sa taille
     * logique à cause du devicePixelRatio / retinaScaling. On mesure
     * directement le rapport entre les pixels réels et la scène.
     */
    const sceneToPixelX =
        source.width / (CANVAS_WIDTH * safeZoom);

    const sceneToPixelY =
        source.height / (CANVAS_HEIGHT * safeZoom);

    if (
        !Number.isFinite(sceneToPixelX) ||
        !Number.isFinite(sceneToPixelY) ||
        sceneToPixelX <= 0 ||
        sceneToPixelY <= 0
    ) {
        console.error(
            "Échelle du canvas invalide pour le blur :",
            source.width,
            source.height,
            safeZoom
        );
        return null;
    }

    /* Capture élargie en coordonnées logiques de scène. */
    const expanded =
        document.createElement("canvas");

    expanded.width = captureWidth;
    expanded.height = captureHeight;

    const expandedContext =
        expanded.getContext("2d");

    if (!expandedContext) {
        return null;
    }

    const sourceX =
        captureLeft * safeZoom * sceneToPixelX;

    const sourceY =
        captureTop * safeZoom * sceneToPixelY;

    const sourceWidth =
        captureWidth * safeZoom * sceneToPixelX;

    const sourceHeight =
        captureHeight * safeZoom * sceneToPixelY;

    expandedContext.drawImage(
        source,
        sourceX,
        sourceY,
        sourceWidth,
        sourceHeight,
        0,
        0,
        captureWidth,
        captureHeight
    );

    /* Application du flou sur la capture élargie. */
    const blurredExpanded =
        document.createElement("canvas");

    blurredExpanded.width = captureWidth;
    blurredExpanded.height = captureHeight;

    const blurContext =
        blurredExpanded.getContext("2d");

    if (!blurContext) {
        return null;
    }

    blurContext.filter =
        `blur(${Math.max(0, Number(radius) || 0)}px)`;

    blurContext.drawImage(
        expanded,
        0,
        0,
        captureWidth,
        captureHeight
    );

    blurContext.filter = "none";

    /* Recadrage exact de la zone sélectionnée. */
    const output =
        document.createElement("canvas");

    output.width = safeWidth;
    output.height = safeHeight;

    const outputContext =
        output.getContext("2d");

    if (!outputContext) {
        return null;
    }

    const cropX = Math.max(
        0,
        Math.round(safeLeft - captureLeft)
    );

    const cropY = Math.max(
        0,
        Math.round(safeTop - captureTop)
    );

    const cropWidth = Math.min(
        safeWidth,
        captureWidth - cropX
    );

    const cropHeight = Math.min(
        safeHeight,
        captureHeight - cropY
    );

    if (
        cropWidth <= 0 ||
        cropHeight <= 0
    ) {
        return null;
    }

    outputContext.drawImage(
        blurredExpanded,
        cropX,
        cropY,
        cropWidth,
        cropHeight,
        0,
        0,
        cropWidth,
        cropHeight
    );

    return output;
}

/*
 * Construit l'objet Fabric correspondant à une zone de blur.
 */
function createBlurObject(
    left,
    top,
    width,
    height,
    radius = DEFAULT_BLUR_RADIUS
) {

    const blurredCanvas =
        createBlurredCanvas(
            left,
            top,
            width,
            height,
            radius
        );

    if (!blurredCanvas) {
        return null;
    }


    const blur =
        new fabric.FabricImage(
            blurredCanvas,
            {

                left:
                    Math.round(left),

                top:
                    Math.round(top),

                originX: "left",
                originY: "top",

                scaleX: 1,
                scaleY: 1,

                selectable: true,
                evented: true,

                hasControls: true,
                hasBorders: true,

                blurType: "blur",
                blurRadius: radius
            }
        );


    return blur;
}


/*
 * Régénère le contenu d'un blur après son déplacement ou
 * son redimensionnement.
 */
function refreshBlurObject(object) {

    if (
        !isBlur(object) ||
        blurUpdateInProgress
    ) {
        return null;
    }


    const width =
        Math.max(
            1,
            object.getScaledWidth()
        );

    const height =
        Math.max(
            1,
            object.getScaledHeight()
        );

    const left =
        object.left;

    const top =
        object.top;


    if (
        !Number.isFinite(left) ||
        !Number.isFinite(top)
    ) {
        return null;
    }


    blurUpdateInProgress = true;


    const objects =
        canvas.getObjects();

    const index =
        objects.indexOf(object);


    /*
     * Masquer temporairement l'ancien snapshot.
     * La capture ne peut donc pas se flouter elle-même.
     */
    object.visible = false;

    canvas.discardActiveObject();
    canvas.renderAll();


    const blurredCanvas =
        createBlurredCanvas(
            left,
            top,
            width,
            height,
            object.blurRadius ||
                DEFAULT_BLUR_RADIUS
        );


    if (!blurredCanvas) {

        object.visible = true;

        canvas.setActiveObject(
            object
        );

        canvas.renderAll();

        blurUpdateInProgress = false;

        return object;
    }


    const replacement =
        new fabric.FabricImage(
            blurredCanvas,
            {

                left,
                top,

                originX: "left",
                originY: "top",

                selectable: true,
                evented: true,

                hasControls: true,
                hasBorders: true,

                blurType: "blur",
                blurRadius:
                    object.blurRadius ||
                    DEFAULT_BLUR_RADIUS
            }
        );


    /*
     * Conserver exactement la même position dans la pile.
     */
    if (index >= 0) {

        canvas.remove(
            object
        );

        canvas.insertAt(
            index,
            replacement
        );

    } else {

        canvas.remove(
            object
        );

        canvas.add(
            replacement
        );
    }


    canvas.setActiveObject(
        replacement
    );

    canvas.renderAll();


    blurUpdateInProgress = false;

    return replacement;
}

/* =====================================================
   FLÈCHE
===================================================== */

/*
   IMPORTANT

   La flèche est maintenant UN SEUL objet Fabric.

   Il n'y a plus :

       whitePath
       +
       colorPath

   qui pourraient avoir des transformations
   internes différentes.

   Le même Path possède :

       fill  = couleur
       stroke = blanc
       shadow = ombre

   Le contour blanc fait donc intrinsèquement
   partie de la même géométrie que la flèche.
*/


function isFancyArrow(object) {

    return !!(
        object &&
        object.arrowType === "fancy"
    );
}


/* -----------------------------------------------------
   DIMENSIONS DE LA FLÈCHE
----------------------------------------------------- */

function getArrowWidths(
    strokeWidth
) {

    /*
       On augmente légèrement les dimensions
       de la géométrie colorée car le contour
       blanc est centré sur son bord.
    */

    const innerTail =
        Math.max(
            12,
            strokeWidth * 2.2
        );

    const innerShaft =
        Math.max(
            24,
            strokeWidth * 4.0
        );

    const innerHead =
        Math.max(
            52,
            innerShaft * 2.35
        );


    /*
       Contour blanc.

       Il reste volontairement raisonnable
       afin de ne pas manger la couleur.
    */
    const outlineWidth =
        Math.max(
            5,
            strokeWidth * 0.90
        );


    return {

        innerTail,
        innerShaft,
        innerHead,

        outlineWidth
    };
}


/* -----------------------------------------------------
   GÉOMÉTRIE
----------------------------------------------------- */

function buildArrowGeometry(
    x1,
    y1,
    x2,
    y2,
    widths
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if (length < 1) {
        return null;
    }


    const ux =
        dx / length;

    const uy =
        dy / length;

    /*
       Vecteur perpendiculaire.
    */
    const px =
        -uy;

    const py =
        ux;


    const shaftWidth =
        widths.innerShaft;

    const tailWidth =
        widths.innerTail;

    const headWidth =
        widths.innerHead;


    /*
       Longueur de la tête.

       Elle reste proportionnelle à la
       longueur totale de la flèche.
    */
    const headLength =
        Math.min(
            length * 0.45,
            Math.max(
                35,
                headWidth * 0.85
            )
        );


    const shaftEnd =
        Math.max(
            0,
            length - headLength
        );


    const points = [];


    /*
       1 — queue haut
    */
    points.push({

        x:
            x1 +
            px *
            tailWidth / 2,

        y:
            y1 +
            py *
            tailWidth / 2
    });


    /*
       2 — corps haut
    */
    points.push({

        x:
            x1 +
            ux *
            shaftEnd +
            px *
            shaftWidth / 2,

        y:
            y1 +
            uy *
            shaftEnd +
            py *
            shaftWidth / 2
    });


    /*
       3 — tête haut
    */
    points.push({

        x:
            x2 -
            ux *
            headLength +
            px *
            headWidth / 2,

        y:
            y2 -
            uy *
            headLength +
            py *
            headWidth / 2
    });


    /*
       4 — pointe
    */
    points.push({

        x: x2,
        y: y2
    });


    /*
       5 — tête bas
    */
    points.push({

        x:
            x2 -
            ux *
            headLength -
            px *
            headWidth / 2,

        y:
            y2 -
            uy *
            headLength -
            py *
            headWidth / 2
    });


    /*
       6 — corps bas
    */
    points.push({

        x:
            x1 +
            ux *
            shaftEnd -
            px *
            shaftWidth / 2,

        y:
            y1 +
            uy *
            shaftEnd -
            py *
            shaftWidth / 2
    });


    /*
       7 — queue bas
    */
    points.push({

        x:
            x1 -
            px *
            tailWidth / 2,

        y:
            y1 -
            py *
            tailWidth / 2
    });


    return points;
}


/* -----------------------------------------------------
   PATH AVEC COINS ARRONDIS
----------------------------------------------------- */

function roundedPolygonPath(
    points,
    radius,
    tipRadius
) {

    if (
        !points ||
        points.length < 3
    ) {
        return "";
    }


    const count =
        points.length;

    const tipIndex = 3;

    const tangentPoints = [];


    /* =================================================
       CALCUL DES TANGENTES
    ================================================= */

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const previous =
            points[
                (i - 1 + count) %
                count
            ];

        const current =
            points[i];

        const next =
            points[
                (i + 1) % count
            ];


        const v1x =
            previous.x -
            current.x;

        const v1y =
            previous.y -
            current.y;

        const v2x =
            next.x -
            current.x;

        const v2y =
            next.y -
            current.y;


        const len1 =
            Math.hypot(
                v1x,
                v1y
            );

        const len2 =
            Math.hypot(
                v2x,
                v2y
            );


        if (
            len1 < 0.001 ||
            len2 < 0.001
        ) {

            tangentPoints.push({

                before: {
                    x: current.x,
                    y: current.y
                },

                after: {
                    x: current.x,
                    y: current.y
                }

            });

            continue;
        }


        /* ---------------------------------------------
           RAYON DU COIN
        --------------------------------------------- */

        const requestedRadius =
            i === tipIndex
                ? tipRadius
                : radius;


        /*
           On ne prend pas simplement 25 % du segment.

           Pour les coins du corps, cela donnait des
           arrondis trop petits, notamment à la queue.

           On autorise ici un arrondi plus important,
           tout en garantissant qu'il ne puisse pas
           dépasser le segment.
        */

        const maxSegmentRadius =
            Math.min(
                len1,
                len2
            ) * 0.45;


        const r =
            Math.min(
                requestedRadius,
                maxSegmentRadius
            );


        /* ---------------------------------------------
           POINT DE TANGENCE AVANT
        --------------------------------------------- */

        const before = {

            x:
                current.x +
                (v1x / len1) *
                r,

            y:
                current.y +
                (v1y / len1) *
                r

        };


        /* ---------------------------------------------
           POINT DE TANGENCE APRÈS
        --------------------------------------------- */

        const after = {

            x:
                current.x +
                (v2x / len2) *
                r,

            y:
                current.y +
                (v2y / len2) *
                r

        };


        tangentPoints.push({

            before,
            after

        });
    }


    /* =================================================
       CONSTRUCTION DU PATH
    ================================================= */

    /*
       On commence après le coin 0.
    */

    const start =
        tangentPoints[0].after;


    const commands = [

        `M ${start.x} ${start.y}`

    ];


    for (
        let i = 1;
        i <= count;
        i++
    ) {

        const index =
            i % count;

        const corner =
            points[index];

        const tangent =
            tangentPoints[index];


        /*
           Ligne jusqu'au début de l'arrondi.
        */

        commands.push(

            `L ${tangent.before.x} ${tangent.before.y}`

        );


        /*
           Arrondi du coin.

           Le point réel du corner est utilisé
           comme contrôle de la courbe quadratique.
        */

        commands.push(

            `Q ${corner.x} ${corner.y} ` +
            `${tangent.after.x} ${tangent.after.y}`

        );
    }


    commands.push("Z");


    return commands.join(" ");
}

/* -----------------------------------------------------
   CRÉATION DU PATH
----------------------------------------------------- */

function createArrowPathData(
    x1,
    y1,
    x2,
    y2,
    strokeWidth
) {

    const widths =
        getArrowWidths(
            strokeWidth
        );


    const points =
        buildArrowGeometry(
            x1,
            y1,
            x2,
            y2,
            widths
        );


    if (!points) {
        return null;
    }


    /*
       Le padding inclut le contour blanc
       et laisse une petite marge.
    */
    const padding =
        widths.outlineWidth +
        8;


    const xs =
        points.map(
            point => point.x
        );

    const ys =
        points.map(
            point => point.y
        );


    const bounds = {

        minX:
            Math.min(...xs) -
            padding,

        minY:
            Math.min(...ys) -
            padding,

        maxX:
            Math.max(...xs) +
            padding,

        maxY:
            Math.max(...ys) +
            padding
    };


    /*
       Passage en coordonnées locales.
    */
    const localPoints =
        points.map(
            point => ({

                x:
                    point.x -
                    bounds.minX,

                y:
                    point.y -
                    bounds.minY

            })
        );


    /*
       Coins légèrement arrondis.
    */
    const radius =
        Math.max(
            12,
            Math.min(
                strokeWidth * 2.2,
                28
            )
        );

    const tipRadius =
        Math.max(
            26,
            Math.min(
                strokeWidth * 3.8,
                50
            )
        );


    const pathData =
        roundedPolygonPath(
            localPoints,
            radius,
            tipRadius
        );


    return {
        pathData,
        bounds,
        widths,
        radius,
        tipRadius
    };
}


/* =====================================================
   CRÉATION DE LA FLÈCHE
===================================================== */

function createFancyArrow(
    x1,
    y1,
    x2,
    y2,
    color,
    strokeWidth
) {

    const geometry =
        createArrowPathData(
            x1,
            y1,
            x2,
            y2,
            strokeWidth
        );


    if (!geometry) {
        return null;
    }


    const {
        pathData,
        bounds,
        widths
    } = geometry;


    /*
       -------------------------------------------------
       COORDONNÉES LOCALES DES EXTRÉMITÉS
       -------------------------------------------------

       Le Path est positionné à bounds.minX/minY.

       On conserve donc les deux points d'ancrage
       dans le même système local que le path.
    */

    const localX1 =
        x1 -
        bounds.minX;

    const localY1 =
        y1 -
        bounds.minY;

    const localX2 =
        x2 -
        bounds.minX;

    const localY2 =
        y2 -
        bounds.minY;


    const arrow =
        new fabric.Path(
            pathData,
            {

                left:
                    bounds.minX,

                top:
                    bounds.minY,

                originX: "left",
                originY: "top",


                fill: color,

                stroke: "#ffffff",

                strokeWidth:
                    widths.outlineWidth,


                strokeLineJoin: "round",
                strokeLineCap: "round",


                shadow:
                    new fabric.Shadow({

                        color:
                            "rgba(0,0,0,0.32)",

                        blur: 5,

                        offsetX: 2,
                        offsetY: 2
                    }),


                selectable: true,
                evented: true,

                hasControls: false,
                hasBorders: true,

                lockScalingX: true,
                lockScalingY: true,
                lockRotation: true,


                /*
                   -------------------------------------------------
                   PROPRIÉTÉS FLÈCHE
                   -------------------------------------------------
                */

                arrowType: "fancy",

                x1,
                y1,

                x2,
                y2,


                /*
                   Points d'ancrage du path.

                   Ils sont exprimés dans le système LOCAL
                   du Fabric.Path.
                */

                arrowPointStart: {
                    x: localX1,
                    y: localY1
                },

                arrowPointEnd: {
                    x: localX2,
                    y: localY2
                },


                arrowColor: color,

                arrowStrokeWidth:
                    strokeWidth
            }
        );


    return arrow;
}


/* =====================================================
   RECONSTRUCTION
===================================================== */

function rebuildArrow(
    oldArrow,
    x1,
    y1,
    x2,
    y2
) {

    return createFancyArrow(

        x1,
        y1,

        x2,
        y2,

        oldArrow.arrowColor ||
            getColor(),

        oldArrow.arrowStrokeWidth ||
            getStrokeWidth()
    );
}


/* =====================================================
   POIGNÉES
===================================================== */

function showArrowHandles(
    object
) {

    if (
        !isFancyArrow(object)
    ) {

        hideArrowHandles();

        return;
    }


    editingArrow =
        object;


    arrowHandleStart.classList.add(
        "visible"
    );

    arrowHandleEnd.classList.add(
        "visible"
    );


    positionArrowHandles(
        object
    );
}


function hideArrowHandles() {

    arrowHandleStart.classList.remove(
        "visible"
    );

    arrowHandleEnd.classList.remove(
        "visible"
    );
}


/* -----------------------------------------------------
   POSITIONNEMENT DES POIGNÉES
----------------------------------------------------- */

function positionArrowHandles(
    object
) {

    if (
        !isFancyArrow(object)
    ) {

        hideArrowHandles();

        return;
    }


    /*
       -------------------------------------------------
       Les coordonnées x1/y1 et x2/y2 sont globales.

       Le Path, lui, travaille avec ses propres
       coordonnées locales.

       On reconstruit donc les coordonnées locales
       des deux extrémités.
       -------------------------------------------------
    */

    const geometry =
        createArrowPathData(
            object.x1,
            object.y1,
            object.x2,
            object.y2,
            object.arrowStrokeWidth
        );


    if (!geometry) {
        return;
    }


    const {
        bounds
    } = geometry;


    /*
       Coordonnées de x1/y1 et x2/y2 dans le
       système utilisé par pathData.
    */

    const localStart =
        new fabric.Point(

            object.x1 -
            bounds.minX,

            object.y1 -
            bounds.minY
        );


    const localEnd =
        new fabric.Point(

            object.x2 -
            bounds.minX,

            object.y2 -
            bounds.minY
        );


    /*
       -------------------------------------------------
       IMPORTANT
       -------------------------------------------------

       Fabric Path utilise pathOffset pour positionner
       son système de coordonnées local.

       On convertit donc le point du path en point
       relatif à l'origine Fabric du Path.
    */

    const pathOffset =
        object.pathOffset ||
        new fabric.Point(
            0,
            0
        );


    const startForFabric =
        new fabric.Point(

            localStart.x -
            pathOffset.x,

            localStart.y -
            pathOffset.y
        );


    const endForFabric =
        new fabric.Point(

            localEnd.x -
            pathOffset.x,

            localEnd.y -
            pathOffset.y
        );


    /*
       -------------------------------------------------
       TRANSFORMATION PAR LE PATH
       -------------------------------------------------
    */

    const startCanvas =
        fabric.util.transformPoint(
            startForFabric,
            object.calcTransformMatrix()
        );


    const endCanvas =
        fabric.util.transformPoint(
            endForFabric,
            object.calcTransformMatrix()
        );


    /*
       -------------------------------------------------
       TRANSFORMATION DU CANVAS VERS L'ÉCRAN
       -------------------------------------------------
    */

    const startScreen =
        fabric.util.transformPoint(
            startCanvas,
            canvas.viewportTransform
        );


    const endScreen =
        fabric.util.transformPoint(
            endCanvas,
            canvas.viewportTransform
        );


    /*
       -------------------------------------------------
       POSITION DU CANVAS DANS LE STAGE
       -------------------------------------------------
    */

    const canvasRect =
        canvas.upperCanvasEl
            .getBoundingClientRect();

    const stageRect =
        stage.getBoundingClientRect();


    const offsetX =
        canvasRect.left -
        stageRect.left;

    const offsetY =
        canvasRect.top -
        stageRect.top;


    /*
       -------------------------------------------------
       POSITION DES POIGNÉES
       -------------------------------------------------
    */

    arrowHandleStart.style.left =
        `${offsetX + startScreen.x}px`;

    arrowHandleStart.style.top =
        `${offsetY + startScreen.y}px`;


    arrowHandleEnd.style.left =
        `${offsetX + endScreen.x}px`;

    arrowHandleEnd.style.top =
        `${offsetY + endScreen.y}px`;
}

/* =====================================================
   DRAG POIGNÉES
===================================================== */

function startArrowHandleDrag(
    event,
    which
) {

    event.preventDefault();
    event.stopPropagation();


    if (!editingArrow) {
        return;
    }


    draggingArrowHandle =
        which;


    document.body.style.userSelect =
        "none";


    updateStatus(

        which === "start"

            ? "Déplacement du début de la flèche"

            : "Déplacement de la pointe de la flèche"
    );
}


function moveArrowHandle(
    event
) {

    if (
        !draggingArrowHandle ||
        !editingArrow
    ) {
        return;
    }


    /*
       Coordonnées écran du canvas.
    */
    const canvasRect =
        canvas.upperCanvasEl
            .getBoundingClientRect();


    const screenX =
        event.clientX -
        canvasRect.left;

    const screenY =
        event.clientY -
        canvasRect.top;


    /*
       Transformation inverse.

       Cela permet de retrouver les coordonnées
       logiques même avec un zoom.
    */
    const inverse =
        fabric.util.invertTransform(
            canvas.viewportTransform
        );


    const point =
        fabric.util.transformPoint(

            new fabric.Point(
                screenX,
                screenY
            ),

            inverse
        );


    let x1 =
        editingArrow.x1;

    let y1 =
        editingArrow.y1;

    let x2 =
        editingArrow.x2;

    let y2 =
        editingArrow.y2;


    if (
        draggingArrowHandle ===
        "start"
    ) {

        x1 =
            clamp(
                point.x,
                -100,
                CANVAS_WIDTH + 100
            );

        y1 =
            clamp(
                point.y,
                -100,
                CANVAS_HEIGHT + 100
            );

    } else {

        x2 =
            clamp(
                point.x,
                -100,
                CANVAS_WIDTH + 100
            );

        y2 =
            clamp(
                point.y,
                -100,
                CANVAS_HEIGHT + 100
            );
    }


    /*
       Empêcher une flèche nulle.
    */
    const dx =
        x2 - x1;

    const dy =
        y2 - y1;

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length < 5) {
        return;
    }


    /*
       Reconstruction complète.

       Il n'y a plus aucune deuxième géométrie
       blanche à synchroniser.
    */
    const newArrow =
        rebuildArrow(
            editingArrow,

            x1,
            y1,

            x2,
            y2
        );


    if (!newArrow) {
        return;
    }


    const objects =
        canvas.getObjects();

    const oldIndex =
        objects.indexOf(
            editingArrow
        );


    canvas.remove(
        editingArrow
    );


    canvas.insertAt(
        oldIndex,
        newArrow
    );


    newArrow.set({
        selectable: true,
        evented: true
    });


    editingArrow =
        newArrow;


    canvas.setActiveObject(
        newArrow
    );


    canvas.renderAll();


    positionArrowHandles(
        newArrow
    );
}


function stopArrowHandleDrag() {

    if (!draggingArrowHandle) {
        return;
    }


    draggingArrowHandle = null;

    document.body.style.userSelect =
        "";


    if (editingArrow) {

        saveHistory();

        showArrowHandles(
            editingArrow
        );
    }


    updateStatus(
        "Flèche modifiée"
    );
}


/* =====================================================
   ÉVÉNEMENTS POIGNÉES
===================================================== */

arrowHandleStart.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        event.stopPropagation();


        /*
           Très important :

           On récupère directement la flèche
           actuellement sélectionnée.
        */
        editingArrow =
            canvas.getActiveObject();


        if (
            editingArrow &&
            isFancyArrow(
                editingArrow
            )
        ) {

            startArrowHandleDrag(
                event,
                "start"
            );
        }
    }
);


arrowHandleEnd.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        event.stopPropagation();


        editingArrow =
            canvas.getActiveObject();


        if (
            editingArrow &&
            isFancyArrow(
                editingArrow
            )
        ) {

            startArrowHandleDrag(
                event,
                "end"
            );
        }
    }
);


window.addEventListener(
    "pointermove",
    moveArrowHandle
);


window.addEventListener(
    "pointerup",
    stopArrowHandleDrag
);


/* =====================================================
   CRÉATION DES OBJETS
===================================================== */

function startDrawing(event) {

    if (
        currentTool === "select" ||
        currentTool === "text"
    ) {
        return;
    }


    const pointer =
        canvas.getScenePoint(
            event.e
        );


    drawing = true;


    drawStart = {

        x: pointer.x,
        y: pointer.y
    };


    temporaryObject = null;
    freehandPoints = [];

    /* -------------------------------------------------
       FEUTRE : TRACÉ LIBRE
    ------------------------------------------------- */

    if (currentTool === "felt") {
        freehandPoints.push({ x: drawStart.x, y: drawStart.y });
        refreshFreehandPreview();
        return;
    }


    /* -------------------------------------------------
       RECTANGLE
    ------------------------------------------------- */

    if (
        currentTool ===
        "rectangle"
    ) {

        temporaryObject =
            new fabric.Rect({

                left:
                    drawStart.x,

                top:
                    drawStart.y,

                width: 1,
                height: 1,

                originX: "left",
                originY: "top",

                rx: 6,
                ry: 6,

                fill: "transparent",

                stroke:
                    getColor(),

                strokeWidth:
                    getStrokeWidth()
            });
    }

    /* -------------------------------------------------
       CERCLE
    ------------------------------------------------- */

    else if (
        currentTool ===
        "circle"
    ) {

        temporaryObject =
            new fabric.Ellipse({

                left:
                    drawStart.x,

                top:
                    drawStart.y,

                rx: 1,
                ry: 1,

                originX: "left",
                originY: "top",

                fill: "transparent",

                stroke:
                    getColor(),

                strokeWidth:
                    getStrokeWidth()
            });
    }


    /* -------------------------------------------------
       SURLIGNAGE
    ------------------------------------------------- */

    else if (
        currentTool ===
        "highlight"
    ) {

        temporaryObject =
            new fabric.Rect({

                left:
                    drawStart.x,

                top:
                    drawStart.y,

                width: 1,
                height: 1,

                originX: "left",
                originY: "top",

                rx: 6,
                ry: 6,

                fill:
                    "rgba(255,220,50,0.30)",

                stroke:
                    "rgba(255,210,30,0.85)",

                strokeWidth: 2,
                fuzeTool: "highlight"
            });
    }

    /* -------------------------------------------------
       BLUR
    ------------------------------------------------- */

    else if (
        currentTool ===
        "blur"
    ) {

        /*
         * Pendant le tracé, on affiche simplement une zone
         * indicative. Le vrai snapshot flouté est créé à la
         * fin du tracé, lorsque les dimensions sont connues.
         */
        temporaryObject =
            new fabric.Rect({

                left:
                    drawStart.x,

                top:
                    drawStart.y,

                width: 1,
                height: 1,

                originX: "left",
                originY: "top",

                fill:
                    "rgba(80,80,80,0.20)",

                stroke:
                    "rgba(80,80,80,0.70)",

                strokeWidth: 2,

                selectable: false,
                evented: false
            });
    }

    /* -------------------------------------------------
       FLÈCHE
    ------------------------------------------------- */

    else if (
        currentTool ===
        "arrow"
    ) {

        temporaryObject =
            createFancyArrow(

                drawStart.x,
                drawStart.y,

                drawStart.x + 1,
                drawStart.y + 1,

                getColor(),
                getStrokeWidth()
            );
    }


    if (temporaryObject) {

        canvas.add(
            temporaryObject
        );


        temporaryObject.set({

            selectable: false,
            evented: false
        });


        canvas.renderAll();
    }
}


function drawingMove(event) {

    if (
        !drawing ||
        !temporaryObject
    ) {
        return;
    }


    const pointer =
        canvas.getScenePoint(
            event.e
        );


    const x =
        pointer.x;

    const y =
        pointer.y;

    if (currentTool === "felt") {
        const last = freehandPoints[freehandPoints.length - 1];
        if (!last || Math.hypot(x - last.x, y - last.y) >= 1.2) {
            freehandPoints.push({ x, y });
            refreshFreehandPreview();
        }
        return;
    }

    /* -------------------------------------------------
       RECTANGLE
    ------------------------------------------------- */

    if (
        currentTool ===
        "rectangle"
    ) {

        const left =
            Math.min(
                drawStart.x,
                x
            );

        const top =
            Math.min(
                drawStart.y,
                y
            );

        const width =
            Math.abs(
                x -
                drawStart.x
            );

        const height =
            Math.abs(
                y -
                drawStart.y
            );


        temporaryObject.set({

            left,
            top,

            width,
            height
        });
    }

    /* -------------------------------------------------
       CERCLE
    ------------------------------------------------- */

    else if (
        currentTool ===
        "circle"
    ) {

        const left =
            Math.min(
                drawStart.x,
                x
            );

        const top =
            Math.min(
                drawStart.y,
                y
            );

        const width =
            Math.abs(
                x -
                drawStart.x
            );

        const height =
            Math.abs(
                y -
                drawStart.y
            );


        temporaryObject.set({

            left,
            top,

            rx:
                width / 2,

            ry:
                height / 2
        });
    }


    /* -------------------------------------------------
       SURLIGNAGE
    ------------------------------------------------- */

    else if (
        currentTool ===
        "highlight"
    ) {

        const left =
            Math.min(
                drawStart.x,
                x
            );

        const top =
            Math.min(
                drawStart.y,
                y
            );

        const width =
            Math.abs(
                x -
                drawStart.x
            );

        const height =
            Math.abs(
                y -
                drawStart.y
            );


        temporaryObject.set({

            left,
            top,

            width,
            height
        });
    }

    /* -------------------------------------------------
       BLUR
    ------------------------------------------------- */

    else if (
        currentTool ===
        "blur"
    ) {

        const left =
            Math.min(
                drawStart.x,
                x
            );

        const top =
            Math.min(
                drawStart.y,
                y
            );

        const width =
            Math.abs(
                x -
                drawStart.x
            );

        const height =
            Math.abs(
                y -
                drawStart.y
            );


        temporaryObject.set({

            left,
            top,

            width,
            height
        });
    }

    /* -------------------------------------------------
       FLÈCHE
    ------------------------------------------------- */

    else if (
        currentTool ===
        "arrow"
    ) {

        const newArrow =
            createFancyArrow(

                drawStart.x,
                drawStart.y,

                x,
                y,

                getColor(),
                getStrokeWidth()
            );


        if (!newArrow) {
            return;
        }


        const index =
            canvas.getObjects()
                .indexOf(
                    temporaryObject
                );


        canvas.remove(
            temporaryObject
        );


        temporaryObject =
            newArrow;


        temporaryObject.set({

            selectable: false,
            evented: false
        });


        canvas.insertAt(
            index,
            temporaryObject
        );
    }


    canvas.renderAll();
}


function finishDrawing() {

    if (!drawing) {
        return;
    }


    drawing = false;

    if (currentTool === "felt") {
        if (freehandPoints.length < 2) {
            const p = freehandPoints[0] || drawStart;
            if (p) freehandPoints.push({ x: p.x + 0.5, y: p.y + 0.5 });
        }
        refreshFreehandPreview();
    }

    if (!temporaryObject) {
        freehandPoints = [];
        return;
    }


    const object =
        temporaryObject;


    temporaryObject = null;
    freehandPoints = [];

    if (
        currentTool ===
        "arrow"
    ) {

        const dx =
            object.x2 -
            object.x1;

        const dy =
            object.y2 -
            object.y1;

        const length =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (length < 8) {

            canvas.remove(
                object
            );

        } else {

            object.set({

                selectable: true,
                evented: true
            });


            editingArrow =
                object;


            canvas.setActiveObject(
                object
            );
        }

    canvas.renderAll();

    saveHistory();

    updateEmptyMessage();

    } else if (
        currentTool ===
        "blur"
    ) {

        const left =
            object.left;

        const top =
            object.top;

        const width =
            object.width;

        const height =
            object.height;


        canvas.remove(
            object
        );


        if (
            width >= 4 &&
            height >= 4
        ) {

            const blur =
                createBlurObject(
                    left,
                    top,
                    width,
                    height
                );

            if (blur) {

                canvas.add(
                    blur
                );

                canvas.setActiveObject(
                    blur
                );

                canvas.renderAll();

                saveHistory();

                updateStatus(
                    "Zone floutée"
                );

            }
        }

        updateEmptyMessage();

    } else {

        object.set({

            selectable: true,
            evented: true
        });


        canvas.setActiveObject(
            object
        );

        canvas.renderAll();

        saveHistory();
        updateEmptyMessage();
    }
    

    if (
        currentTool !==
        "select"
    ) {

        setTool(
            "select"
        );
    }
}

function addTextAt(event) {

    const pointer =
        canvas.getScenePoint(
            event

    const text =
        new fabric.IText(

            "Votre texte",

            {

                left:
                    pointer.x,

                top:
                    pointer.y,

                originX:
                    "left",

                originY:
                    "top",

                /* =====================================
                   TEXTE COLORÉ
                ===================================== */

                fill:
                    getColor(),

                fontSize:
                    getFontSize(),

                fontFamily:
                    "Arial",

                fontWeight:
                    "500",

                editable:
                    true,


                /* =====================================
                   HALO BLANC
                ===================================== */

                stroke:
                    "#ffffff",

                strokeWidth:
                    8,

                strokeLineJoin:
                    "round",

                strokeLineCap:
                    "round",


                /*
                 * TRÈS IMPORTANT
                 *
                 * Le contour blanc est dessiné
                 * AVANT le remplissage coloré.
                 *
                 * Le texte coloré reste donc
                 * parfaitement visible.
                 */
                paintFirst:
                    "stroke",


                /* =====================================
                   OMBRE GRISE
                ===================================== */

                shadow:
                    new fabric.Shadow({

                        color:
                            "rgba(99, 99, 99, 0.85)",

                        blur:
                            10,

                        offsetX:
                            0,

                        offsetY:
                            0
                    })
            }
        );


    /* =================================================
       AJOUT
    ================================================= */

    canvas.add(
        text
    );


    /* =================================================
       SÉLECTION
    ================================================= */

    canvas.setActiveObject(
        text
    );


    /* =================================================
       ÉDITION
    ================================================= */

    text.enterEditing();

    text.selectAll();


    /* =================================================
       HISTORIQUE
    ================================================= */

    saveHistory();


    /* =================================================
       RETOUR AU MODE SÉLECTION
    ================================================= */

    setTool(
        "select"
    );


    updateEmptyMessage();
}

/* =====================================================
   DÉPLACEMENT DE LA FLÈCHE
===================================================== */

canvas.on(
    "object:moving",
    event => {

        const object =
            event.target;


        if (
            !isFancyArrow(object)
        ) {
            return;
        }


        if (
            object.__previousLeft ===
            undefined
        ) {

            object.__previousLeft =
                object.left;

            object.__previousTop =
                object.top;
        }


        const dx =
            object.left -
            object.__previousLeft;

        const dy =
            object.top -
            object.__previousTop;


        /*
           Le déplacement du Path correspond
           à une translation de ses deux extrémités.
        */
        object.x1 += dx;
        object.y1 += dy;

        object.x2 += dx;
        object.y2 += dy;


        object.__previousLeft =
            object.left;

        object.__previousTop =
            object.top;


        positionArrowHandles(
            object
        );
    }
);


canvas.on(
    "object:moved",
    event => {

        const object =
            event.target;


        if (
            isFancyArrow(object)
        ) {

            delete object.__previousLeft;
            delete object.__previousTop;


            positionArrowHandles(
                object
            );


            saveHistory();
        }
    }
);

/* =====================================================
   DÉPLACEMENT / REDIMENSIONNEMENT DU BLUR
===================================================== */

/*
 * Le blur est un snapshot. Après une modification de sa
 * géométrie, on le régénère à partir du contenu situé dessous.
 */
canvas.on(
    "object:modified",
    event => {

        const object =
            event.target;


        if (blurUpdateInProgress) {
            return;
        }


        if (isBlur(object)) {

            const replacement =
                refreshBlurObject(
                    object
                );

            if (replacement) {

                canvas.setActiveObject(
                    replacement
                );
            }

            saveHistory();

            updateStatus(
                "Zone de blur modifiée"
            );

            return;
        }


        /*
         * Si l'image ou une annotation située dessous a été
         * déplacée/redimensionnée, les zones de blur doivent
         * continuer à masquer le bon contenu.
         */
        const blurObjects =
            canvas.getObjects()
                .filter(isBlur);


        if (!blurObjects.length) {
            return;
        }


        const active =
            canvas.getActiveObject();


        blurObjects.forEach(
            blur => {

                refreshBlurObject(
                    blur
                );
            }
        );


        if (active && !isBlur(active)) {

            canvas.setActiveObject(
                active
            );
        }


        canvas.renderAll();

        saveHistory();
    }
);


/* =====================================================
   SYNCHRONISATION DES CONTRÔLES
===================================================== */

function syncControlsFromSelectedObject() {

    const object = canvas.getActiveObject();
    syncThicknessControl();

    if (!object) return;


    const selectedObjects = canvas.getActiveObjects();
    if (selectedObjects.length > 1) {
        const newWidth = getStrokeWidth();
        const newColor = getColor();
        const thicknessWasEdited = document.activeElement === strokeWidthInput;
        let changed = false;
        selectedObjects.forEach(item => {
            if (isFancyArrow(item)) {
                item.arrowColor = newColor;
                if (thicknessWasEdited) item.arrowStrokeWidth = newWidth;
                item.set({
                    stroke: newColor,
                    ...(thicknessWasEdited ? { strokeWidth: newWidth } : {})
                });
                changed = true;
            } else if (["rect", "ellipse", "path"].includes(item.type)) {
                item.set({
                    stroke: item.fuzeTool === "highlight" ? "rgba(255,210,30,0.85)" : newColor,
                    ...(thicknessWasEdited ? { strokeWidth: newWidth } : {}),
                    opacity: getStrokeOpacity()
                });
                changed = true;
            }
        });
        if (changed) {
            canvas.requestRenderAll();
            syncControlsFromSelectedObject();
            saveHistory();
            updateStatus("Épaisseur appliquée aux objets sélectionnés");
        }
        return;
    }

    /* -------------------------------------------------
       FLÈCHE
    ------------------------------------------------- */

    if (
        isFancyArrow(object)
    ) {

        if (object.arrowColor) {

            colorInput.value =
                object.arrowColor;
        }


        if (
            Number.isFinite(
                object.arrowStrokeWidth
            )
        ) {

            strokeWidthInput.value =
                object.arrowStrokeWidth;
        }


        return;
    }


    /* -------------------------------------------------
       TEXTE
    ------------------------------------------------- */

    if (
        object.type === "i-text"
    ) {

        if (
            typeof object.fill === "string" &&
            object.fill.startsWith("#")
        ) {

            colorInput.value =
                object.fill;
        }


        if (
            Number.isFinite(
                object.fontSize
            )
        ) {

            fontSizeInput.value =
                Math.round(
                    object.fontSize
                );
        }


        return;
    }


    /* -------------------------------------------------
       RECTANGLE / CERCLE
    ------------------------------------------------- */

    if (
        object.type === "rect" ||
        object.type === "ellipse"
    ) {

        if (
            typeof object.stroke === "string" &&
            object.stroke.startsWith("#")
        ) {

            colorInput.value =
                object.stroke;
        }


        if (
            Number.isFinite(
                object.strokeWidth
            )
        ) {

            strokeWidthInput.value =
                object.strokeWidth;
        }
    }
}

/* =====================================================
   MODIFICATION COULEUR / ÉPAISSEUR
===================================================== */

function updateSelectedObject() {

    const object =
        canvas.getActiveObject();


    if (!object) {
        updateStatus(
            "Sélectionnez un objet"
        );

        return;
    }


    /* -------------------------------------------------
       FLÈCHE
    ------------------------------------------------- */

    if (
        isFancyArrow(object)
    ) {

        const newColor =
            getColor();

        const newStrokeWidth =
            getStrokeWidth();


        /*
           On reconstruit la flèche avec exactement
           les mêmes points d'ancrage.
        */
        const newArrow =
            createFancyArrow(

                object.x1,
                object.y1,

                object.x2,
                object.y2,

                newColor,
                newStrokeWidth
            );


        if (!newArrow) {
            return;
        }


        const objects =
            canvas.getObjects();

        const index =
            objects.indexOf(object);


        if (index < 0) {
            return;
        }


        /*
           Remplacement de l'ancienne flèche.
        */
        canvas.remove(
            object
        );


        canvas.insertAt(
            index,
            newArrow
        );


        newArrow.set({
            selectable: true,
            evented: true
        });


        /*
           Nouvelle sélection.
        */
        canvas.setActiveObject(
            newArrow
        );


        editingArrow =
            newArrow;


        /*
           Rendu.
        */
        canvas.renderAll();


        /*
           Repositionnement des poignées.
        */
        showArrowHandles(
            newArrow
        );


        /*
           Synchronisation des contrôles.
        */
        syncControlsFromSelectedObject();


        saveHistory();


        updateStatus(
            "Flèche modifiée"
        );


        return;
    }


    /* -------------------------------------------------
       TEXTE
    ------------------------------------------------- */

    if (
        object.type === "i-text"
    ) {

        object.set({
            fill: getColor()
        });


        /*
           Ne modifier la taille que si le changement
           vient réellement du contrôle de taille.
           La valeur actuelle est conservée sinon.
        */
        if (
            document.activeElement ===
            fontSizeInput
        ) {

            object.set({
                fontSize:
                    getFontSize()
            });
        }


        canvas.requestRenderAll();


        syncControlsFromSelectedObject();


        saveHistory();


        updateStatus(
            "Texte modifié"
        );


        return;
    }


    /* -------------------------------------------------
       RECTANGLE / CERCLE
    ------------------------------------------------- */

    if (
        object.type === "rect" ||
        object.type === "ellipse" ||
        object.type === "path"
    ) {

        object.set({

            stroke:
                getColor(),

            strokeWidth: getStrokeWidth(),

            opacity: getStrokeOpacity()
        });


        canvas.requestRenderAll();


        syncControlsFromSelectedObject();


        saveHistory();


        updateStatus(
            "Objet modifié"
        );
    }
}

/* =====================================================
   EXPORT PNG
===================================================== */

/**
 * Prépare les paramètres d'export :
 * - crop automatique à tous les objets
 * - marge autour des objets
 * - fond transparent
 */
function getPngExportDataURL() {

    // Masquer les poignées de flèche
    hideArrowHandles();

    // Supprimer la sélection pour qu'elle
    // n'apparaisse jamais dans le PNG
    canvas.discardActiveObject();

    canvas.renderAll();


    const objects = canvas.getObjects();


    // --------------------------------------------------
    // Aucun objet
    // --------------------------------------------------

    if (!objects.length) {

        updateStatus(
            "Aucun élément à exporter"
        );

        return null;
    }


    // --------------------------------------------------
    // Calcul des limites de tous les objets
    // --------------------------------------------------

    let minLeft = Infinity;
    let minTop = Infinity;

    let maxRight = -Infinity;
    let maxBottom = -Infinity;


    objects.forEach(object => {

        const bounds =
            object.getBoundingRect({

                includeStroke: true,

                includeShadow: true,

                absolute: true
            });


        minLeft =
            Math.min(
                minLeft,
                bounds.left
            );


        minTop =
            Math.min(
                minTop,
                bounds.top
            );


        maxRight =
            Math.max(
                maxRight,
                bounds.left + bounds.width
            );


        maxBottom =
            Math.max(
                maxBottom,
                bounds.top + bounds.height
            );
    });


    // --------------------------------------------------
    // MARGE AUTOUR DU CONTENU
    // --------------------------------------------------

    /*
     * Marge supplémentaire autour
     * de tous les objets.
     *
     * 12 px permet notamment de ne pas
     * couper l'ombre du texte.
     */
    const exportMargin =
        12;


    minLeft -=
        exportMargin;

    minTop -=
        exportMargin;

    maxRight +=
        exportMargin;

    maxBottom +=
        exportMargin;


    // --------------------------------------------------
    // Dimensions finales
    // --------------------------------------------------

    const width = maxRight - minLeft;


    const height = maxBottom - minTop;


    if (
        width <= 0 ||
        height <= 0
    ) {

        updateStatus(
            "Zone d'export invalide"
        );

        return null;
    }

    

    // --------------------------------------------------
    // Sauvegarder le fond actuel
    // --------------------------------------------------

    const oldBackgroundColor =
        canvas.backgroundColor;


    // --------------------------------------------------
    // Fond transparent pendant l'export
    // --------------------------------------------------

    canvas.backgroundColor = null;

    canvas.renderAll();


    // --------------------------------------------------
    // Export recadré
    // --------------------------------------------------

    const dataUrl =
        canvas.toDataURL({

            format: "png",

            left: minLeft,

            top: minTop,

            width: width,

            height: height,

            multiplier:
                1 / zoom
        });


    // --------------------------------------------------
    // Restaurer le fond de l'éditeur
    // --------------------------------------------------

    canvas.backgroundColor =
        oldBackgroundColor;

    canvas.renderAll();


    return dataUrl;
}


/* =====================================================
   COPIER PNG
===================================================== */

async function copyPng() {

    try {

        const dataUrl =
            getPngExportDataURL();


        if (!dataUrl) {
            return;
        }


        const response =
            await fetch(dataUrl);


        const blob =
            await response.blob();


        await navigator.clipboard.write([

            new ClipboardItem({

                "image/png":
                    blob
            })

        ]);


        updateStatus(
            "PNG recadré copié dans le presse-papiers"
        );

    } catch (error) {

        console.error(error);

        updateStatus(
            "Copie PNG impossible"
        );
    }


    canvas.renderAll();
}

/* =====================================================
   ORDRE DES ÉLÉMENTS
===================================================== */

function bringSelectedObjectForward() {

    const object =
        canvas.getActiveObject();

    if (!object) {
        return;
    }


    const objects =
        canvas.getObjects();

    const index =
        objects.indexOf(object);


    /*
       Déjà tout devant.
    */
    if (
        index < 0 ||
        index >= objects.length - 1
    ) {
        return;
    }


    /*
       Monter d'un niveau.
    */
    canvas.bringObjectForward(
        object
    );


    canvas.renderAll();

    saveHistory();
}


function sendSelectedObjectBackward() {

    const object =
        canvas.getActiveObject();

    if (!object) {
        return;
    }


    const objects =
        canvas.getObjects();

    const index =
        objects.indexOf(object);


    /*
       Déjà tout derrière.
    */
    if (
        index <= 0
    ) {
        return;
    }


    /*
       Descendre d'un niveau.
    */
    canvas.sendObjectBackwards(
        object
    );


    canvas.renderAll();

    saveHistory();
}

/* =====================================================
   CLAVIER
===================================================== */

document.addEventListener("keydown", event => {

    /* =================================================
       UNDO
    ================================================= */

    if (
        event.ctrlKey &&
        !event.shiftKey &&
        event.key.toLowerCase() === "z"
    ) {

        event.preventDefault();

        if (
            editingText &&
            editingText.isEditing
        ) {

            editingText.exitEditing();

            requestAnimationFrame(() => {
                undo();
            });

        } else {

            undo();
        }

        return;
    }


    /* =================================================
       REDO
    ================================================= */

    if (
        (
            event.ctrlKey &&
            event.key.toLowerCase() === "y"
        )
        ||
        (
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() === "z"
        )
    ) {

        event.preventDefault();

        if (
            editingText &&
            editingText.isEditing
        ) {

            editingText.exitEditing();

            requestAnimationFrame(() => {
                redo();
            });

        } else {

            redo();
        }

        return;
    }


    /* =================================================
       NE PAS INTERCEPTER LES CHAMPS HTML
    ================================================= */

    const target = event.target;

    if (
        target instanceof HTMLInputElement ||
        target instanceof HTMLTextAreaElement ||
        target instanceof HTMLSelectElement ||
        target.isContentEditable
    ) {
        return;
    }


    /* =================================================
       RACCOURCIS FUZE
    ================================================= */

    const key = event.key.toLowerCase();

    // Actions de fichier : raccourcis choisis pour éviter les commandes Chrome.
    if (event.ctrlKey && !event.shiftKey && !event.altKey && key === "o") {
        event.preventDefault();
        imageInput.click();
        return;
    }

    if (event.ctrlKey && !event.shiftKey && !event.altKey && key === "s") {
        event.preventDefault();
        document.getElementById("downloadPngButton").click();
        return;
    }

    if (event.ctrlKey && event.altKey && !event.shiftKey && key === "c") {
        event.preventDefault();
        document.getElementById("copyPngButton").click();
        return;
    }

    if (event.ctrlKey && event.altKey && !event.shiftKey && key === "backspace") {
        event.preventDefault();
        document.getElementById("clearButton").click();
        return;
    }

    // Sélection rapide des outils : uniquement sans modificateur.
    if (!event.ctrlKey && !event.altKey && !event.metaKey && !event.shiftKey) {
        const toolByKey = {
            s: "select",
            t: "text",
            a: "arrow",
            r: "rectangle",
            c: "circle",
            f: "felt",
            h: "highlight",
            b: "blur"
        };
        if (toolByKey[key]) {
            event.preventDefault();
            setTool(toolByKey[key]);
            document.querySelectorAll(".toolbar-menu").forEach(menu => menu.removeAttribute("open"));
            return;
        }
    }

    /* =================================================
       SUPPRESSION
    ================================================= */

    if (
        event.key === "Delete" ||
        event.key === "Backspace"
    ) {

        const activeObject =
            canvas.getActiveObject();

        if (activeObject) {

            canvas.remove(activeObject);
            canvas.discardActiveObject();

            canvas.requestRenderAll();

            saveHistory();

            updateEmptyMessage();
        }

        return;
    }
});

document.addEventListener(
    "keydown",
    event => {

        /*
           Ne pas intercepter les flèches lorsqu'on
           écrit dans un champ texte.
        */

        const target =
            event.target;

        if (
            target instanceof HTMLInputElement ||
            target instanceof HTMLTextAreaElement ||
            target.isContentEditable
        ) {
            return;
        }


        /*
           Flèche du haut :
           monter l'objet d'un niveau.
        */

        if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();

            bringSelectedObjectForward();

            return;
        }


        /*
           Flèche du bas :
           descendre l'objet d'un niveau.
        */

        if (
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

            sendSelectedObjectBackward();

            return;
        }

    }
);

/* =====================================================
   COLLAGE D'UNE IMAGE DEPUIS LE PRESSE-PAPIERS
===================================================== */

document.addEventListener("paste", async (event) => {

    const items = event.clipboardData?.items;

    if (!items) {
        return;
    }

    for (const item of items) {

        // On ne traite que les images
        if (!item.type.startsWith("image/")) {
            continue;
        }

        event.preventDefault();

        const file = item.getAsFile();

        if (!file) {
            continue;
        }

        try {

            const dataUrl = await new Promise((resolve, reject) => {

                const reader = new FileReader();

                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;

                reader.readAsDataURL(file);
            });

            const img =
                await fabric.FabricImage.fromURL(dataUrl);

            // Applique le même réglage que pour les images chargées.
            // « No resize » conserve la taille originale de l'image.
            const scale = getImageImportScale();

            img.set({
                scaleX: scale,
                scaleY: scale,

                left: CANVAS_WIDTH / 2,
                top: CANVAS_HEIGHT / 2,

                originX: "center",
                originY: "center",

                selectable: true,
                evented: true
            });

            canvas.add(img);

            canvas.setActiveObject(img);
            canvas.renderAll();

            saveHistory();

            updateEmptyMessage();

            updateStatus("Image collée depuis le presse-papiers");

        } catch (error) {

            console.error(
                "Erreur lors du collage de l'image :",
                error
            );

            updateStatus("Impossible de coller l'image");
        }

        // Une seule image par collage
        break;
    }
});
